name: Gerar snake

on:
  schedule:
    - cron: "0 */12 * * *"   # a cada 12h
  workflow_dispatch:          # permite rodar manualmente
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVG da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake.svg?palette=github-dark&color_snake=00e59b&color_dots=0d1117,16341f,1d6b45,22d3ee,00e59b

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
