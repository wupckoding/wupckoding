<svg width="860" height="380" viewBox="0 0 860 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borda" x1="0" y1="0" x2="860" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00e59b"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 430 190" to="360 430 190" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="titulo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e59b"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- máquina de escrever: cada linha revelada por um clipPath animado -->
    <clipPath id="l1"><rect x="60" y="120" width="0" height="26"><animate attributeName="width" from="0" to="760" begin="0.6s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="60" y="152" width="0" height="26"><animate attributeName="width" from="0" to="760" begin="1.5s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="60" y="196" width="0" height="26"><animate attributeName="width" from="0" to="760" begin="2.7s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="60" y="228" width="0" height="26"><animate attributeName="width" from="0" to="760" begin="3.6s" dur="1.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="60" y="272" width="0" height="26"><animate attributeName="width" from="0" to="760" begin="5.0s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="60" y="304" width="0" height="26"><animate attributeName="width" from="0" to="760" begin="5.9s" dur="1.2s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- moldura com gradiente girando -->
  <rect x="2" y="2" width="856" height="376" rx="18" fill="url(#borda)"/>
  <rect x="5" y="5" width="850" height="370" rx="15" fill="#0d1117"/>

  <!-- barra da janela -->
  <rect x="5" y="5" width="850" height="46" rx="15" fill="#161b22"/>
  <rect x="5" y="36" width="850" height="15" fill="#161b22"/>
  <circle cx="34" cy="28" r="7" fill="#ff5f57"/>
  <circle cx="58" cy="28" r="7" fill="#febc2e"/>
  <circle cx="82" cy="28" r="7" fill="#28c840"/>
  <text x="430" y="33" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',monospace" font-size="14" fill="#8b949e">bruno@wupckoding: ~/build</text>

  <!-- título -->
  <text x="60" y="92" font-family="'JetBrains Mono','Fira Code',monospace" font-weight="800" font-size="30" fill="url(#titulo)">Bruno · wupckoding</text>

  <!-- sessão do terminal -->
  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="17">
    <g clip-path="url(#l1)">
      <text x="60" y="139"><tspan fill="#00e59b">$</tspan><tspan fill="#e6edf3" dx="10">whoami</tspan></text>
    </g>
    <g clip-path="url(#l2)">
      <text x="60" y="171" fill="#9fb1c1">full-stack developer — do zero ao deploy, sozinho</text>
    </g>
    <g clip-path="url(#l3)">
      <text x="60" y="215"><tspan fill="#00e59b">$</tspan><tspan fill="#e6edf3" dx="10">cat stack.txt</tspan></text>
    </g>
    <g clip-path="url(#l4)">
      <text x="60" y="247"><tspan fill="#22d3ee">PHP</tspan><tspan fill="#485566" dx="8">·</tspan><tspan fill="#22d3ee" dx="8">MySQL</tspan><tspan fill="#485566" dx="8">·</tspan><tspan fill="#22d3ee" dx="8">JavaScript</tspan><tspan fill="#485566" dx="8">·</tspan><tspan fill="#22d3ee" dx="8">Python</tspan><tspan fill="#485566" dx="8">·</tspan><tspan fill="#22d3ee" dx="8">LLM APIs</tspan></text>
    </g>
    <g clip-path="url(#l5)">
      <text x="60" y="291"><tspan fill="#00e59b">$</tspan><tspan fill="#e6edf3" dx="10">./deploy --now</tspan></text>
    </g>
    <g clip-path="url(#l6)">
      <text x="60" y="323"><tspan fill="#8b5cf6">▲</tspan><tspan fill="#9fb1c1" dx="10">gateways de IA</tspan><tspan fill="#485566" dx="8">·</tspan><tspan fill="#9fb1c1" dx="8">checkout PIX em produção</tspan><tspan fill="#485566" dx="8">·</tspan><tspan fill="#9fb1c1" dx="8">Claude Code tooling</tspan></text>
    </g>

    <!-- cursor piscando -->
    <rect x="60" y="342" width="11" height="21" fill="#00e59b" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;1;0;1" keyTimes="0;0.55;0.6;0.7;0.8;0.9;1" dur="8s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
